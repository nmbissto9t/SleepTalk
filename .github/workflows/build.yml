name: Build IPA

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project SleepTalk.xcodeproj \
            -scheme SleepTalk \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|Test Suite '.*' (passed|failed)|TEST (SUCCEEDED|FAILED)"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project SleepTalk.xcodeproj \
            -scheme SleepTalk \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/SleepTalk.app

      - name: Show compiler errors
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null | grep -E "error:|failed" | sort -u | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package for TrollStore
        run: |
          APP=build/Build/Products/Release-iphoneos/SleepTalk.app
          ldid -SConfig/Entitlements.plist "$APP/SleepTalk"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SleepTalk.tipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepTalk-tipa
          path: SleepTalk.tipa

      - name: Publish test download link
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test >/dev/null 2>&1 || \
            gh release create test --prerelease --target "$GITHUB_SHA" --title "测试版" --notes "测试分支的最新编译结果。用手机下载 SleepTalk.tipa，再用 TrollStore 打开安装。"
          gh release upload test SleepTalk.tipa --clobber

      - name: Publish download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新版本" --notes "用手机下载 SleepTalk.tipa，再用 TrollStore 打开安装。"
          gh release upload latest SleepTalk.tipa --clobber
